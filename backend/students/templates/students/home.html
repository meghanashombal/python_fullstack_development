
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ecommerce - Home</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f1f5f9;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
        }

        /* Navbar */
        .navbar {
            background: #172554 !important;
            padding: 18px 6%;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.12);
        }

        .navbar-brand {
            color: white !important;
            font-size: 25px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .navbar a.nav-link-custom {
            color: #e2e8f0;
            text-decoration: none;
            margin-left: 25px;
            font-size: 15px;
            font-weight: 500;
            transition: 0.3s;
        }

        .navbar a.nav-link-custom:hover {
            color: #facc15;
        }

        .btn-login {
            background: transparent;
            border: 1px solid white;
            color: white !important;
            padding: 9px 20px;
            border-radius: 7px;
        }

        .btn-register {
            background: #facc15;
            color: #172554 !important;
            padding: 10px 20px;
            border-radius: 7px;
            font-weight: 600 !important;
        }

        .btn-logout {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 7px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-logout:hover {
            background: #dc2626;
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(120deg, #172554, #2563eb);
            color: white;
            padding: 120px 20px;
            text-align: center;
        }

        .hero h1 {
            font-size: 46px;
            font-weight: 750;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 18px;
            color: #dbeafe;
            margin-bottom: 30px;
        }

        .btn-shop {
            background: #facc15;
            color: #172554;
            padding: 14px 35px;
            text-decoration: none;
            border-radius: 8px;
            display: inline-block;
            font-weight: 700;
            transition: 0.3s;
        }

        .btn-shop:hover {
            background: #eab308;
            transform: translateY(-3px);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .navbar {
                padding: 15px 20px;
            }

            .navbar-brand {
                font-size: 21px;
            }

            .navbar a.nav-link-custom {
                margin-left: 10px;
                font-size: 13px;
            }

            .hero {
                padding: 85px 20px;
            }

            .hero h1 {
                font-size: 30px;
            }

            .hero p {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark">

    <a class="navbar-brand" href="{% url 'home' %}">
        Ecommerce
    </a>

    <div class="d-flex align-items-center flex-wrap gap-3">

        <a href="{% url 'home' %}" class="nav-link-custom">
            Home
        </a>

        <a href="{% url 'products' %}" class="nav-link-custom">
            Products
        </a>

        {% if user.is_authenticated %}

            <form method="POST" action="{% url 'logout' %}" class="m-0">
                {% csrf_token %}
                <button type="submit" class="btn-logout">
                    Logout
                </button>
            </form>

        {% else %}

            <a href="{% url 'login' %}" class="nav-link-custom btn-login">
                Login
            </a>

            <a href="{% url 'register' %}" class="nav-link-custom btn-register">
                Register
            </a>

        {% endif %}

    </div>

</nav>

<!-- Hero Section -->
<section class="hero">

    <h1>Welcome to My Ecommerce Store</h1>

    <p>
        Discover the best products at affordable prices.
        Shop smarter and enjoy the best shopping experience.
    </p>

    <a href="{% url 'products' %}" class="btn-shop">
        Shop Now
    </a>

</section>

</body>
</html>
